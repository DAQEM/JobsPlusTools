architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

apply from: rootProject.file("gradle/scripts/platform.gradle")
apply from: rootProject.file("gradle/scripts/publishing.gradle")
apply from: rootProject.file("gradle/scripts/maven-publishing.gradle")

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modApi "dev.architectury:architectury-fabric:${project.architectury_version}"
    modRuntimeOnly "com.daqem.uilib:uilib-fabric:${project.uilib_version}"
    modRuntimeOnly "com.daqem.yamlconfig:yamlconfig-fabric:${project.yamlconfig_version}"
    modRuntimeOnly "com.daqem.arc:arc-fabric:${project.arc_version}"
    modRuntimeOnly "com.daqem.itemrestrictions:itemrestrictions-fabric:${project.itemrestrictions_version}"
    modRuntimeOnly "com.daqem.jobsplus:jobsplus-fabric:${project.itemrestrictions_version}"
}