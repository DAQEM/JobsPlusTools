modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "${mod_repository}/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
license = "${mod_license}"
displayName = "${mod_name}"
authors = "${mod_author}"
credits = "${mod_author}"
description = "${mod_description}"

[[dependencies."${mod_id}"]]
modId = "neoforge"
mandatory = true
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "knot"
mandatory = true
versionRange = "[${knot_version},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "jobsplustools-common.mixins.json"

[[mixins]]
config = "jobsplustools.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"